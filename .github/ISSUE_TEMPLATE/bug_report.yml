name: Bug 报告
description: 转换结果错误、报错或排版不符合预期
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先查阅 [故障排查手册](../blob/main/references/troubleshooting.md)。
  - type: textarea
    id: command
    attributes:
      label: 完整命令与 --verbose 输出
      placeholder: |
        python scripts/md_convert.py demo.md -o demo.docx --toc --verbose
        （附完整终端输出）
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: 环境版本
      description: 操作系统 / Python / pandoc 版本
      placeholder: Windows 11 / Python 3.12 / pandoc 3.9
    validations:
      required: true
  - type: textarea
    id: expect
    attributes:
      label: 期望结果与实际结果
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 最小复现 Markdown 片段
      placeholder: 能触发问题的最小 md 内容
