name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pandoc (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sL https://github.com/jgm/pandoc/releases/download/3.9.0.2/pandoc-3.9.0.2-linux-amd64.tar.gz \
            | sudo tar xz --strip-components=1 -C /usr/local

      - name: Install TeX Live + CJK fonts (Linux, for PDF)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-lang-chinese texlive-fonts-recommended \
            texlive-latex-recommended texlive-latex-extra \
            fonts-noto-cjk lmodern

      - name: Install pandoc (Windows)
        if: runner.os == 'Windows'
        run: choco install pandoc --yes --no-progress

      - name: Toolchain versions
        run: |
          python --version
          pandoc --version

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

      - name: Smoke convert examples
        run: |
          python skills/md-convert/scripts/to_docx.py examples/demo.md -o temp/output/demo.docx --toc
          python skills/md-convert/scripts/to_html.py examples/demo.md -o temp/output/demo.html --toc
        shell: bash

      - name: Smoke convert PDF (Linux, XeLaTeX)
        if: runner.os == 'Linux'
        run: |
          python skills/md-convert/scripts/to_pdf.py examples/demo.md -o temp/output/demo.pdf --toc             --cjk-font "Noto Serif CJK SC" --latin-font "TeX Gyre Termes"
        shell: bash

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outputs-${{ matrix.os }}
          path: temp/output/
          retention-days: 7
          if-no-files-found: warn
